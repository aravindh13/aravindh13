<svg xmlns="http://www.w3.org/2000/svg" width="434" height="128" viewBox="0 0 434 128" role="img" aria-label="07 AI Travel Itinerary Planner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#111826"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6577"/></marker>
</defs>
<style>
  .flow{stroke-dasharray:4 5;animation:f 1.4s linear infinite}
  @keyframes f{to{stroke-dashoffset:-18}}
  @media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect x=".5" y=".5" width="433" height="127" rx="12" fill="url(#bg)" stroke="#232c3b"/>
<rect x=".5" y=".5" width="433" height="127" rx="12" fill="url(#grid)"/>
<text x="24" y="38" font-family="ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12" fill="url(#ac)" font-weight="700">07</text>
<text x="50" y="39" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8edf5">AI Travel Itinerary Planner</text>
<text x="24" y="66" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a94a6">Itineraries built from free time slots.</text>
<text x="24" y="104" font-family="ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#2dd4bf">React Native  ·  MongoDB  ·  MySQL</text>
</svg>
